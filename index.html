<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sales Page - Produk Hebat</title>
  <style>
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: #f9f9f9;
      color: #333;
    }
    header {
      background: linear-gradient(90deg, #007acc, #00c6ff);
      color: white;
      text-align: center;
      padding: 60px 20px;
    }
    header h1 {
      font-size: 48px;
      margin: 0;
    }
    header p {
      font-size: 20px;
      margin-top: 10px;
    }
    .container {
      max-width: 1000px;
      margin: 40px auto;
      padding: 20px;
      text-align: center;
    }
    .product {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    .product img {
      max-width: 100%;
      border-radius: 8px;
    }
    .product h2 {
      margin-top: 20px;
      font-size: 32px;
      color: #007acc;
    }
    .product p {
      font-size: 18px;
      line-height: 1.6;
    }
    .cta {
      margin-top: 30px;
    }
    .cta button {
      background: #ff6600;
      color: white;
      border: none;
      padding: 15px 40px;
      font-size: 20px;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.3s;
    }
    .cta button:hover {
      background: #e65c00;
    }
    footer {
      background: #007acc;
      color: white;
      text-align: center;
      padding: 20px;
      margin-top: 40px;
    }
  </style>
</head>
<body>
  <header>
    <h1>Produk Hebat untuk Anda</h1>
    <p>Tingkatkan hidup Anda dengan solusi terbaik</p>
  </header>

  <div class="container">
    <div class="product">
      <img src="https://assets.pikiran-rakyat.com/crop/0x0:0x0/720x0/webp/photo/2026/03/07/3980233369.jpg" alt="Produk Hebat">
      <h2>Kenapa Pilih Produk Ini?</h2>
      <p>
        ✔ Kualitas premium<br>
        ✔ Harga terjangkau<br>
        ✔ Garansi 100% kepuasan<br>
        ✔ Support 24/7
      </p>
      <div class="cta">
        <button>Beli Sekarang</button>
      </div>
    </div>
  </div>

  <footer>
    <p>&copy; 2026 Sales Page | Hubungi kami: 081118800118</p>
  </footer>
</body>
</html>
